// ── CYCLE ──
// 31-day cycle. 3 weeks high energy, 1 week low energy (menstrual).
// Phase thresholds (days 1-31):
//   Menstrual (low energy): days 1-7
//   Follicular (rising):    days 8-14
//   Ovulatory (peak):       days 15-17
//   Luteal (high energy):   days 18-31
function cyclePhaseFromStart(startStr) {
  if (!startStr) return { phase: 'follicular', day: 10 };
  const start = new Date(startStr + 'T00:00:00');
  const dayNum = Math.max(1, Math.floor((new Date() - start) / (24*60*60*1000)) + 1);
  const d = ((dayNum - 1) % 31) + 1;
  const phase = d <= 7 ? 'menstrual' : d <= 14 ? 'follicular' : d <= 17 ? 'ovulatory' : 'luteal';
  return { phase, day: d };
}

// ── PHASE STRUCTURE ──
// Phase A: Aug 2026 – Nov 2026 (base building)
// Phase B: Dec 2026 – Jan 2027 (intensity + breathhold build)
// Phase C: Feb 2027 – Mar 5, 2027 (peak)
// Phase D: Mar 5–19, 2027 (taper + attempt)
const PHASE_STARTS = {
  A: new Date('2026-08-10'),
  B: new Date('2026-12-01'),
  C: new Date('2027-02-01'),
  D: new Date('2027-03-05'),
};

function todayPhase() {
  const d = new Date();
  if (d >= PHASE_STARTS.D) return 'D';
  if (d >= PHASE_STARTS.C) return 'C';
  if (d >= PHASE_STARTS.B) return 'B';
  return 'A';
}

function todayWeekIdx() {
  const ph = todayPhase();
  const ms = 7*24*60*60*1000;
  const maxWeeks = { A:16, B:9, C:4, D:3 };
  const idx = Math.floor((new Date() - PHASE_STARTS[ph]) / ms);
  return Math.max(0, Math.min(idx, maxWeeks[ph]-1));
}

    if (!holdTime) return;
    const entry = { date: new Date().toISOString().slice(0,10), time: holdTime, note: swimNote };

    setStaticLog(next); sv({ staticLog: next });

    if (!distance) return;
    const entry = { date: new Date().toISOString().slice(0,10), distance, note: swimNote };

// ── CYCLE VIEW ──
function CycleView({ T, TEAL, AMBER, BLUE, PURPLE, RED,
  cycleStart, setCycleStart, bleedDays, setBleedDays,
  feelingsLog, setFeelingsLog, cyclePhase, cycleDay, phaseColor, phaseLabel, sv, Pill }) {

  const [selDate, setSelDate] = useState(new Date().toISOString().slice(0,10));
  const [feeling, setFeeling] = useState('');

  const logFeeling = () => {
    if (!feeling.trim()) return;
    const next = { ...feelingsLog, [selDate]: feeling };
    setFeelingsLog(next); sv({ feelingsLog: next });
    setFeeling('');
  };

  const toggleBleed = (date) => {
    const next = bleedDays.includes(date)
      ? bleedDays.filter(d => d !== date)
      : [...bleedDays, date];
    setBleedDays(next); sv({ bleedDays: next });
  };

  const phaseInfo = {
    menstrual: { icon:'🩸', color:RED, energy:'Low Energy Week', training:'10% effort. Yoga, walks, gentle swim. No weights.', frenzel:'Best Frenzel gains. Parasympathetic access highest.', nutrition:'Iron-rich foods. Vitamin C. Magnesium. Hydrate more.' },
    follicular: { icon:'🌱', color:TEAL, energy:'Energy Rising', training:'Build intensity. Increase weights and distances progressively.', frenzel:'Good Frenzel window. Practice all positions.', nutrition:'Fresh greens, eggs, seeds, lean protein.' },
    ovulatory: { icon:'🔥', color:AMBER, energy:'Peak Power', training:'Go hard. Heaviest loads. Static PRs. Race simulation. Best week for breakthrough sessions.', frenzel:'Peak coordination. Best dynamic apnea performance.', nutrition:'Maintain protein. Light on carbs. Peak performance window.' },
    luteal: { icon:'🍂', color:PURPLE, energy:'High Energy — Building', training:'Maintain loads. Prioritise sleep. Shift to endurance.', frenzel:'Consistent Frenzel practice. All positions.', nutrition:'Complex carbs. Magnesium. Dark chocolate. Reduce sugar.' },
  };
  const info = phaseInfo[cyclePhase] || phaseInfo.follicular;

  // Simple calendar for current month
  const today = new Date();
  const yr = today.getFullYear(), mo = today.getMonth();
  const firstDay = new Date(yr, mo, 1).getDay();
  const daysInMonth = new Date(yr, mo+1, 0).getDate();
  const calDays = Array.from({ length: firstDay }, () => null)
    .concat(Array.from({ length: daysInMonth }, (_,i) => i+1));

  return (
    <div>
      <div style={{ fontSize:18, fontWeight:700, marginBottom:4 }}>🌙 Cycle</div>
      <div style={{ fontSize:11, color:T.textFaint, marginBottom:14 }}>
        3 weeks high energy · 1 week low energy · 31-day cycle
      </div>

      {/* Current phase */}
      <div style={{ background: info.color + '18', border:`1px solid ${info.color}44`,
        borderRadius:12, padding:'14px 16px', marginBottom:14 }}>
        <div style={{ fontSize:22, marginBottom:4 }}>{info.icon}</div>
        <div style={{ fontSize:16, fontWeight:700, color:info.color, marginBottom:2 }}>{phaseLabel}</div>
        <div style={{ fontSize:11, color:T.textFaint }}>Day {cycleDay} of 31</div>
        <div style={{ height:1, background:info.color+'33', margin:'10px 0' }} />
        <div style={{ fontSize:11, color:T.textSub, marginBottom:4 }}>⚡ {info.energy}</div>
        <div style={{ fontSize:11, color:T.textSub, marginBottom:4 }}>🏋️ {info.training}</div>
        <div style={{ fontSize:11, color:T.textSub, marginBottom:4 }}>🤿 {info.frenzel}</div>
        <div style={{ fontSize:11, color:T.textSub }}>🥗 {info.nutrition}</div>
      </div>

      {/* Cycle start */}
      <div style={{ background:T.surface, border:`1px solid ${T.border}`,
        borderRadius:10, padding:'12px 14px', marginBottom:14 }}>
        <div style={{ fontSize:12, fontWeight:700, color:T.text, marginBottom:8 }}>Cycle Start Date</div>
        <input type="date" value={cycleStart}
          onChange={e => {
            setCycleStart(e.target.value);
            sv({ cycleStart: e.target.value });
          }}
          style={{ width:'100%', background:T.card, border:`1px solid ${T.border}`,
            borderRadius:6, padding:'8px 12px', color:T.text, fontFamily:'Georgia,serif',
            fontSize:13, boxSizing:'border-box' }} />
      </div>

      {/* Calendar */}
      <div style={{ background:T.surface, border:`1px solid ${T.border}`,
        borderRadius:10, padding:'12px 14px', marginBottom:14 }}>
        <div style={{ fontSize:12, fontWeight:700, color:T.text, marginBottom:10 }}>
          {today.toLocaleString('default', { month:'long' })} — tap to mark flow
        </div>
        <div style={{ display:'grid', gridTemplateColumns:'repeat(7,1fr)', gap:4 }}>
          {['S','M','T','W','T','F','S'].map(d => (
            <div key={d} style={{ textAlign:'center', fontSize:10, color:T.textFaint, paddingBottom:4 }}>{d}</div>
          ))}
          {calDays.map((day, i) => {
            if (!day) return <div key={i} />;
            const dateStr = `${yr}-${String(mo+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
            const isBleed = bleedDays.includes(dateStr);
            const isToday = day === today.getDate();
            return (
              <div key={i} onClick={() => toggleBleed(dateStr)} style={{
                textAlign:'center', padding:'6px 2px', borderRadius:6, cursor:'pointer',
                background: isBleed ? RED : isToday ? TEAL+'33' : 'transparent',
                color: isBleed ? '#fff' : isToday ? TEAL : T.textSub,
                fontSize:11, fontWeight: isToday ? 700 : 400,
              }}>{day}</div>
            );
          })}
        </div>
      </div>

      {/* Feelings log */}
      <div style={{ background:T.surface, border:`1px solid ${T.border}`,
        borderRadius:10, padding:'12px 14px' }}>
        <div style={{ fontSize:12, fontWeight:700, color:T.text, marginBottom:8 }}>Daily Note</div>
        <input type="date" value={selDate} onChange={e => setSelDate(e.target.value)}
          style={{ width:'100%', background:T.card, border:`1px solid ${T.border}`,
            borderRadius:6, padding:'6px 10px', color:T.text, fontFamily:'Georgia,serif',
            fontSize:12, boxSizing:'border-box', marginBottom:8 }} />
        <textarea value={feeling} onChange={e => setFeeling(e.target.value)}
          placeholder="How are you feeling today?"
          style={{ width:'100%', background:T.card, border:`1px solid ${T.border}`,
            borderRadius:6, padding:'8px 12px', color:T.text, fontFamily:'Georgia,serif',
            fontSize:12, boxSizing:'border-box', minHeight:70, resize:'none', marginBottom:8 }} />
        <button onClick={logFeeling} style={{ background:PURPLE, color:'#fff', border:'none',
          borderRadius:8, padding:'8px 20px', fontFamily:'Georgia,serif', fontSize:12,
          cursor:'pointer', width:'100%' }}>Save Note</button>
        {feelingsLog[selDate] && (
          <div style={{ marginTop:10, fontSize:12, color:T.textSub,
            borderTop:`1px solid ${T.border}`, paddingTop:8 }}>
            {feelingsLog[selDate]}
          </div>
        )}
      </div>
    </div>
  );
}

// ── LOG VIEW ──
function LogView({ T, TEAL, AMBER, BLUE, PURPLE,
  staticLog, swimLog, reflection, setReflection, notes, setNotes, sv, ProgressBar }) {

  const [tab, setTab] = useState('static');

  return (
    <div>
      <div style={{ fontSize:18, fontWeight:700, marginBottom:14 }}>📋 Log</div>

      <div style={{ display:'flex', gap:6, marginBottom:14 }}>
        {['static','swim','notes'].map(t => (
          <button key={t} onClick={() => setTab(t)} style={{
            flex:1, padding:'8px 4px', borderRadius:8, border:'none',
            background: tab===t ? TEAL : T.surface,
            color: tab===t ? '#111' : T.textFaint,
            fontFamily:'Georgia,serif', fontSize:11, cursor:'pointer', fontWeight:700,
          }}>{t}</button>
        ))}
      </div>

      {tab === 'static' && (
        <div>
          <div style={{ fontSize:12, color:T.textFaint, marginBottom:10 }}>
            Static apnea history · Goal: 6:00 by Mar 19
          </div>
          {staticLog.length === 0 && (
            <div style={{ textAlign:'center', color:T.textFaint, padding:32, fontSize:12 }}>
              No holds logged yet. Log from the Swim tab.
            </div>
          )}
          {staticLog.map((e,i) => (
            <div key={i} style={{ background:T.surface, border:`1px solid ${T.border}`,
              borderRadius:8, padding:'10px 14px', marginBottom:8,
              display:'flex', justifyContent:'space-between', alignItems:'center' }}>
              <div>
                <div style={{ fontSize:11, color:T.textFaint }}>{e.date}</div>
                {e.note && <div style={{ fontSize:11, color:T.textSub, marginTop:2 }}>{e.note}</div>}
              </div>
              <div style={{ fontSize:20, fontWeight:700, color:TEAL }}>{e.time}</div>
            </div>
          ))}
        </div>
      )}

      {tab === 'swim' && (
        <div>
          <div style={{ fontSize:12, color:T.textFaint, marginBottom:10 }}>
            Swim distances · Goal: 100m comfortable Jan 30 · 120m Mar 1
          </div>
          {(swimLog||[]).length === 0 && (
            <div style={{ textAlign:'center', color:T.textFaint, padding:32, fontSize:12 }}>
              No swims logged yet.
            </div>
          )}
          {(swimLog||[]).map((e,i) => (
            <div key={i} style={{ background:T.surface, border:`1px solid ${T.border}`,
              borderRadius:8, padding:'10px 14px', marginBottom:8,
              display:'flex', justifyContent:'space-between', alignItems:'center' }}>
              <div>
                <div style={{ fontSize:11, color:T.textFaint }}>{e.date}</div>
                {e.note && <div style={{ fontSize:11, color:T.textSub, marginTop:2 }}>{e.note}</div>}
              </div>
              <div style={{ fontSize:20, fontWeight:700, color:BLUE }}>{e.distance}m</div>
            </div>
          ))}
        </div>
      )}

      {tab === 'notes' && (
        <div>
          <div style={{ fontSize:12, fontWeight:700, color:AMBER, marginBottom:8 }}>Weekly Reflection</div>
          <textarea value={reflection} onChange={e => { setReflection(e.target.value); sv({ reflection: e.target.value }); }}
            placeholder="What worked this week? What needs adjusting?"
            style={{ width:'100%', background:T.surface, border:`1px solid ${T.border}`,
              borderRadius:8, padding:'10px 12px', color:T.text, fontFamily:'Georgia,serif',
              fontSize:12, boxSizing:'border-box', minHeight:120, resize:'none', marginBottom:12 }} />
          <div style={{ fontSize:12, fontWeight:700, color:BLUE, marginBottom:8 }}>Quick Notes</div>
          <textarea value={notes} onChange={e => { setNotes(e.target.value); sv({ notes: e.target.value }); }}
            placeholder="Anything you want to remember..."
            style={{ width:'100%', background:T.surface, border:`1px solid ${T.border}`,
              borderRadius:8, padding:'10px 12px', color:T.text, fontFamily:'Georgia,serif',
              fontSize:12, boxSizing:'border-box', minHeight:100, resize:'none' }} />
        </div>
      )}
    </div>
  );
}



// ── THEME ──
const DARK = {
  bg:'#0b0d10', surface:'#13161c', card:'#1a1d24', border:'#2a2d34',
  text:'#dde4ee', textSub:'#b0b8cc', textFaint:'#888ea8', textVeryDim:'#555566',
};
const LIGHT = {
  bg:'#f4f6fb', surface:'#ffffff', card:'#f0f2f8', border:'#d8dce8',
  text:'#1a1d28', textSub:'#3a4060', textFaint:'#7080a0', textVeryDim:'#aab0c0',
};

const TEAL   = '#4ecdc4';
const BLUE   = '#6699cc';
const AMBER  = '#f0a500';
const PURPLE = '#9b8ec4';
const RED    = '#e05555';
const GREEN  = '#5cb85c';

const STORAGE_KEY = 'jr_v1';

function save(updates, state) {
  const current = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
  localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...current, ...updates }));
}

function load() {
  try {
    const raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    // Always derive cycle phase from start date
    const { cyclePhase: _cp, cycleDay: _cd, ...rest } = raw;
    return rest;
  } catch { return {}; }
}

function Pill({ color, children }) {
  return (
    <span style={{ background: color + '22', color, borderRadius:12, padding:'2px 10px',
      fontSize:10, fontWeight:700, letterSpacing:'0.08em', textTransform:'uppercase' }}>
      {children}
    </span>
  );
}

function Check({ done, color, onToggle, size=16 }) {
  return (
    <div onClick={onToggle} style={{ width:size, height:size, borderRadius:size/2,
      border:`2px solid ${done ? color : '#444'}`, background: done ? color : 'transparent',
      cursor:'pointer', flexShrink:0, display:'flex', alignItems:'center', justifyContent:'center',
      transition:'all 0.15s' }}>
      {done && <span style={{ color:'#111', fontSize:size*0.6, fontWeight:900, lineHeight:1 }}>✓</span>}
    </div>
  );
}

function ProgressBar({ value, max, color }) {
  const pct = max === 0 ? 0 : Math.min(100, Math.round((value/max)*100));
  return (
    <div style={{ height:6, background:'#2a2d34', borderRadius:3, overflow:'hidden' }}>
      <div style={{ height:'100%', width:`${pct}%`, background:color, transition:'width 0.4s', borderRadius:3 }} />
    </div>
  );
}

function App() {
  const [dark, setDark] = useState(true);
  const T = dark ? DARK : LIGHT;

  const [view, setView] = useState('home');
  const [checked, setChecked] = useState({});
  const [mochaLog, setMochaLog] = useState({});
  const [mochaBiting, setMochaBiting] = useState([]);
  const [mochaScores, setMochaScores] = useState({});
  const [cycleStart, setCycleStart] = useState('2026-08-10');
  const [bleedDays, setBleedDays] = useState([]);
  const [feelingsLog, setFeelingsLog] = useState({});
  const [staticLog, setStaticLog] = useState([]);
  const [swimLog, setSwimLog] = useState([]);
  const [hsVideosDone, setHsVideosDone] = useState([]);
  const [hsReelsDone, setHsReelsDone] = useState({});
  const [pimsleurCount, setPimsleurCount] = useState(0);
  const [lingopieCount, setLingopieCount] = useState(0);
  const [vocabCount, setVocabCount] = useState(0);
  const [vocabLog, setVocabLog] = useState([]);
  const [ppuDone, setPpuDone] = useState([]);
  const [disasterDone, setDisasterDone] = useState([]);
  const [reflection, setReflection] = useState('');
  const [notes, setNotes] = useState('');

  useEffect(() => {
    const d = load();
    if (d.checked) setChecked(d.checked);
    if (d.mochaLog) setMochaLog(d.mochaLog);
    if (d.mochaBiting) setMochaBiting(d.mochaBiting);
    if (d.mochaScores) setMochaScores(d.mochaScores);
    if (d.cycleStart) setCycleStart(d.cycleStart);
    if (d.bleedDays) setBleedDays(d.bleedDays);
    if (d.feelingsLog) setFeelingsLog(d.feelingsLog);
    if (d.staticLog) setStaticLog(d.staticLog);
    if (d.swimLog) setSwimLog(d.swimLog);
    if (d.hsVideosDone) setHsVideosDone(d.hsVideosDone);
    if (d.hsReelsDone) setHsReelsDone(d.hsReelsDone);
    if (d.pimsleurCount) setPimsleurCount(d.pimsleurCount);
    if (d.lingopieCount) setLingopieCount(d.lingopieCount);
    if (d.vocabCount) setVocabCount(d.vocabCount);
    if (d.vocabLog) setVocabLog(d.vocabLog);
    if (d.ppuDone) setPpuDone(d.ppuDone);
    if (d.disasterDone) setDisasterDone(d.disasterDone);
    if (d.reflection) setReflection(d.reflection);
    if (d.notes) setNotes(d.notes);
    if (d.dark !== undefined) setDark(d.dark);
  }, []);

  const sv = (updates) => {
    const current = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...current, ...updates }));
  };

  const toggle = (key) => {
    const next = { ...checked, [key]: !checked[key] };
    setChecked(next); sv({ checked: next });
  };

  // Cycle
  const { phase: cyclePhase, day: cycleDay } = cyclePhaseFromStart(cycleStart);
  const isLowEnergy = cyclePhase === 'menstrual';

  const phaseColor = { menstrual:RED, follicular:TEAL, ovulatory:AMBER, luteal:PURPLE }[cyclePhase] || TEAL;
  const phaseLabel = { menstrual:'🩸 Menstrual — Low Energy Week', follicular:'🌱 Follicular — Energy Rising',
                       ovulatory:'🔥 Ovulatory — Peak Power', luteal:'🍂 Luteal — High Energy' }[cyclePhase];

  const containerStyle = {
    minHeight:'100vh', background:T.bg, color:T.text,
    fontFamily:'Georgia, serif', maxWidth:430, margin:'0 auto',
    paddingBottom: 80,
  };

  const navStyle = {
    position:'fixed', bottom:0, left:'50%', transform:'translateX(-50%)',
    width:'100%', maxWidth:430, background:T.surface,
    borderTop:`1px solid ${T.border}`, display:'flex', zIndex:100,
    paddingBottom:'env(safe-area-inset-bottom)',
  };

  const navItems = [
    { id:'home',  icon:'⌂',  label:'Home' },
    { id:'week',  icon:'📅', label:'Week' },
    { id:'swim',  icon:'🌊', label:'Swim' },
    { id:'gym',   icon:'💪', label:'Gym' },
    { id:'span',  icon:'🇪🇸', label:'Spanish' },
    { id:'hs',    icon:'🌸', label:'Honey' },
    { id:'dis',   icon:'🚨', label:'Disaster' },
    { id:'cycle', icon:'🌙', label:'Cycle' },
    { id:'log',   icon:'📋', label:'Log' },
  ];

  const shared = { T, TEAL, BLUE, AMBER, PURPLE, RED, GREEN,
    checked, toggle, cyclePhase, cycleDay, phaseColor, phaseLabel, isLowEnergy,
    cycleStart, setCycleStart, bleedDays, setBleedDays, feelingsLog, setFeelingsLog,
    staticLog, setStaticLog, swimLog, setSwimLog,
    mochaLog, setMochaLog, mochaBiting, setMochaBiting, mochaScores, setMochaScores,
    hsVideosDone, setHsVideosDone, hsReelsDone, setHsReelsDone,
    pimsleurCount, setPimsleurCount, lingopieCount, setLingopieCount,
    vocabCount, setVocabCount, vocabLog, setVocabLog,
    ppuDone, setPpuDone, disasterDone, setDisasterDone,
    reflection, setReflection, notes, setNotes, sv, dark, setDark,
    Pill, Check, ProgressBar,
  };

  return (
    <div style={containerStyle}>
      <div style={{ padding:'16px 16px 0' }}>
        {view === 'home'  && <HomeView {...shared} />}
        {view === 'week'  && <WeekView {...shared} />}
        {view === 'swim'  && <SwimView {...shared} />}
        {view === 'gym'   && <GymView {...shared} />}
        {view === 'span'  && <SpanishView {...shared} />}
        {view === 'hs'    && <HoneysuckleView {...shared} />}
        {view === 'dis'   && <DisasterView {...shared} />}
        {view === 'cycle' && <CycleView {...shared} />}
        {view === 'log'   && <LogView {...shared} />}
      </div>

      <nav style={navStyle}>
        {navItems.map(item => (
          <button key={item.id} onClick={() => setView(item.id)} style={{
            flex:1, border:'none', background:'transparent', padding:'8px 2px 6px',
            color: view===item.id ? TEAL : T.textFaint, cursor:'pointer',
            display:'flex', flexDirection:'column', alignItems:'center', gap:2,
          }}>
            <span style={{ fontSize:16 }}>{item.icon}</span>
            <span style={{ fontSize:9, letterSpacing:'0.05em' }}>{item.label}</span>
          </button>
        ))}
      </nav>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
  
</script>
</body>
</html>
