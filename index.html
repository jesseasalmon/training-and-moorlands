// ── CYCLE ──
// 31-day cycle. 3 weeks high energy, 1 week low energy (menstrual).
// Phase thresholds (days 1-31):
//   Menstrual (low energy): days 1-7
//   Follicular (rising):    days 8-14
//   Ovulatory (peak):       days 15-17
//   Luteal (high energy):   days 18-31
function cyclePhaseFromStart(startStr) {
  if (!startStr) return { phase: 'follicular', day: 10 };
  const start = new Date(startStr + 'T00:00:00');
  const dayNum = Math.max(1, Math.floor((new Date() - start) / (24*60*60*1000)) + 1);
  const d = ((dayNum - 1) % 31) + 1;
  const phase = d <= 7 ? 'menstrual' : d <= 14 ? 'follicular' : d <= 17 ? 'ovulatory' : 'luteal';
  return { phase, day: d };
}

// ── PHASE STRUCTURE ──
// Phase A: Aug 2026 – Nov 2026 (base building)
// Phase B: Dec 2026 – Jan 2027 (intensity + breathhold build)
// Phase C: Feb 2027 – Mar 5, 2027 (peak)
// Phase D: Mar 5–19, 2027 (taper + attempt)
const PHASE_STARTS = {
  A: new Date('2026-08-10'),
  B: new Date('2026-12-01'),
  C: new Date('2027-02-01'),
  D: new Date('2027-03-05'),
};

function todayPhase() {
  const d = new Date();
  if (d >= PHASE_STARTS.D) return 'D';
  if (d >= PHASE_STARTS.C) return 'C';
  if (d >= PHASE_STARTS.B) return 'B';
  return 'A';
}

function todayWeekIdx() {
  const ph = todayPhase();
  const ms = 7*24*60*60*1000;
  const maxWeeks = { A:16, B:9, C:4, D:3 };
  const idx = Math.floor((new Date() - PHASE_STARTS[ph]) / ms);
  return Math.max(0, Math.min(idx, maxWeeks[ph]-1));
}

// ── WEEK VIEW ──
function WeekView({ T, TEAL, AMBER, BLUE, PURPLE, RED,
  isLowEnergy, cyclePhase, phaseColor, checked, toggle, Check, Pill }) {

  const today = new Date();
  const weekStart = new Date(today);
  weekStart.setDate(today.getDate() - today.getDay() + 1); // Monday

  const days = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

  return (
    <div>
      <div style={{ fontSize:18, fontWeight:700, marginBottom:4 }}>This Week</div>
      <div style={{ fontSize:11, color:T.textFaint, marginBottom:16 }}>
        Week of {weekStart.toLocaleDateString('en-US', { month:'long', day:'numeric' })}
      </div>

      {isLowEnergy && (
        <div style={{ background:RED+'18', border:`1px solid ${RED}44`, borderRadius:10,
          padding:'10px 14px', marginBottom:16, fontSize:12, color:RED }}>
          🩸 LOW ENERGY WEEK — All training drops to 10% effort. Gentle movement, yoga, walking, breathwork only. No weights.
        </div>
      )}

      {days.map(dow => {
        const sched = DAILY_SCHEDULE[dow];
        const isToday = dow === ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][today.getDay()];
        const typeColor = {
          'distance+gym_lower': TEAL,
          'buddy+gym_lower': AMBER,
          'distance+gym_upper': BLUE,
          'rest': T.textFaint,
        }[sched.type] || TEAL;

        return (
          <div key={dow} style={{
            background: isToday ? T.surface : T.card,
            border:`1px solid ${isToday ? TEAL : T.border}`,
            borderRadius:10, padding:'12px 14px', marginBottom:10,
          }}>
            <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center' }}>
              <div>
                <span style={{ fontSize:13, fontWeight:700,
                  color: isToday ? TEAL : T.text }}>{dow} </span>
                {isToday && <Pill color={TEAL}>Today</Pill>}
              </div>
              <Pill color={typeColor}>{sched.type}</Pill>
            </div>
            <div style={{ fontSize:11, color:T.textSub, marginTop:4 }}>{sched.note}</div>

            {isLowEnergy && sched.type !== 'rest' && (
              <div style={{ fontSize:10, color:RED, marginTop:4 }}>
                → Replaced with gentle movement this week
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

// ── SWIM VIEW ──
function SwimView({ T, TEAL, AMBER, BLUE, RED, checked, toggle, Check,
  isLowEnergy, staticLog, setStaticLog, swimLog, setSwimLog, sv }) {

  const [activeTab, setActiveTab] = useState('buddy');
  const [holdTime, setHoldTime] = useState('');
  const [distance, setDistance] = useState('');
  const [swimNote, setSwimNote] = useState('');

  const addHold = () => {
    if (!holdTime) return;
    const entry = { date: new Date().toISOString().slice(0,10), time: holdTime, note: swimNote };
    const next = [entry, ...staticLog].slice(0,50);
    setStaticLog(next); sv({ staticLog: next });
    setHoldTime(''); setSwimNote('');
  };

  const addSwim = () => {
    if (!distance) return;
    const entry = { date: new Date().toISOString().slice(0,10), distance, note: swimNote };
    const next = [entry, ...(swimLog||[])].slice(0,50);
    setSwimLog(next); sv({ swimLog: next });
    setDistance(''); setSwimNote('');
  };

  const tabs = ['buddy','distance','log'];

  if (isLowEnergy) return (
    <div>
      <div style={{ fontSize:18, fontWeight:700, marginBottom:12 }}>🌊 Swim</div>
      <div style={{ background:RED+'18', border:`1px solid ${RED}44`, borderRadius:10,
        padding:16, marginBottom:16 }}>
        <div style={{ fontSize:13, color:RED, fontWeight:600, marginBottom:6 }}>🩸 Low Energy Week</div>
        <div style={{ fontSize:12, color:T.textSub }}>No breath hold work this week. Optional gentle swim: 400-600m easy, arms only or light kick. Water feel only.</div>
      </div>
    </div>
  );

  return (
    <div>
      <div style={{ fontSize:18, fontWeight:700, marginBottom:4 }}>🌊 Swim Training</div>
      <div style={{ fontSize:11, color:T.textFaint, marginBottom:16 }}>
        Goal: 100m comfortable by Jan 30 · 120m by Mar 1 · 6 min hold by Mar 19
      </div>

      {/* Progress bar */}
      <div style={{ background:T.surface, border:`1px solid ${T.border}`, borderRadius:10,
        padding:'12px 14px', marginBottom:14 }}>
        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12 }}>
          {[
            { label:'Best Hold', value: staticLog[0]?.time || '—', unit:'min:sec', color:TEAL },
            { label:'Best Distance', value: swimLog?.[0]?.distance || '—', unit:'metres', color:AMBER },
          ].map(s => (
            <div key={s.label}>
              <div style={{ fontSize:10, color:T.textFaint }}>{s.label}</div>
              <div style={{ fontSize:24, fontWeight:700, color:s.color }}>{s.value}</div>
              <div style={{ fontSize:10, color:T.textFaint }}>{s.unit}</div>
            </div>
          ))}
        </div>
      </div>

      {/* Tabs */}
      <div style={{ display:'flex', gap:8, marginBottom:16 }}>
        {tabs.map(t => (
          <button key={t} onClick={() => setActiveTab(t)} style={{
            flex:1, padding:'8px 4px', borderRadius:8, border:'none',
            background: activeTab===t ? TEAL : T.surface,
            color: activeTab===t ? '#111' : T.textFaint,
            fontFamily:'Georgia, serif', fontSize:11, cursor:'pointer', fontWeight:700,

function GymView({ T, TEAL, AMBER, BLUE, PURPLE, RED, isLowEnergy, checked, toggle, Check }) {
  const [activeDay, setActiveDay] = useState('wed');
  const today = new Date();
  const dow = ['sun','mon','tue','wed','thu','fri','sat'][today.getDay()];

  if (isLowEnergy) return (
    <div>
      <div style={{ fontSize:18, fontWeight:700, marginBottom:12 }}>💪 Gym</div>
      <div style={{ background:RED+'18', border:`1px solid ${RED}44`, borderRadius:10,
        padding:16 }}>
        <div style={{ fontSize:13, color:RED, fontWeight:600, marginBottom:6 }}>🩸 Low Energy Week — No Weights</div>
        <div style={{ fontSize:12, color:T.textSub }}>
          This week: yoga, stretching, gentle walks only. Return to lifting next week when energy rises.
          {'\n\n'}Use this time for extra Frenzel practice, breathwork, and visualisation.
        </div>
      </div>
    </div>
  );

  const sessions = {
    wed: GYM_LOWER_A,
    thu: GYM_UPPER,
    fri: GYM_LOWER_B,
  };

  const dayColors = { wed:TEAL, thu:BLUE, fri:AMBER };

  return (
    <div>
      <div style={{ fontSize:18, fontWeight:700, marginBottom:4 }}>💪 Gym Sessions</div>
      <div style={{ fontSize:11, color:T.textFaint, marginBottom:16 }}>
        Wed + Fri = Lower Body · Thu = Upper Body · 20–50 pushups every session
      </div>

      {/* Day tabs */}
      <div style={{ display:'flex', gap:8, marginBottom:16 }}>
        {['wed','thu','fri'].map(d => (
          <button key={d} onClick={() => setActiveDay(d)} style={{
            flex:1, padding:'10px 4px', borderRadius:8, border:'none',
            background: activeDay===d ? dayColors[d] : T.surface,
            color: activeDay===d ? '#111' : T.textFaint,
            fontFamily:'Georgia,serif', fontSize:12, cursor:'pointer', fontWeight:700,
          }}>{d.charAt(0).toUpperCase()+d.slice(1)}</button>
        ))}
      </div>

      {/* Session */}
      {sessions[activeDay] && (() => {
        const sess = sessions[activeDay];
        const color = dayColors[activeDay];
        const todayKey = today.toISOString().slice(0,10);
        return (
          <div>
            <div style={{ fontSize:14, fontWeight:700, color, marginBottom:12 }}>{sess.label}</div>
            {sess.tasks.map((task, i) => {
              const key = `gym_${todayKey}_${activeDay}_${i}`;
              const done = !!checked[key];
              if (task.startsWith('─')) {
                const lbl = task.replace(/─/g,'').trim();
                return (
                  <div key={i} style={{ display:'flex', alignItems:'center', gap:6,
                    marginTop:12, marginBottom:6 }}>
                    <div style={{ flex:1, height:1, background:color+'44' }} />
                    <span style={{ fontSize:9, color, fontWeight:700, textTransform:'uppercase',
                      letterSpacing:'0.12em', whiteSpace:'nowrap' }}>{lbl}</span>
                    <div style={{ flex:1, height:1, background:color+'44' }} />
                  </div>
                );
              }
              return (
                <div key={i} onClick={() => toggle(key)} style={{
                  display:'flex', alignItems:'flex-start', gap:10, padding:'6px 4px',
                  marginBottom:4, cursor:'pointer',
                }}>
                  <div style={{ paddingTop:2 }}>
                    <Check done={done} color={color} onToggle={() => toggle(key)} size={15} />
                  </div>
                  <span style={{ fontSize:12, color: done ? T.textFaint : T.textSub,
                    textDecoration: done ? 'line-through' : 'none', flex:1, lineHeight:1.5 }}>
                    {task}
                  </span>
                </div>
              );
            })}
          </div>
        );
      })()}
    </div>
  );
}

// ── SPANISH VIEW ──
function SpanishView({ T, TEAL, AMBER, BLUE, PURPLE,
  pimsleurCount, setPimsleurCount, lingopieCount, setLingopieCount,
  vocabCount, setVocabCount, vocabLog, setVocabLog, sv, ProgressBar, Pill }) {

  const [tab, setTab] = useState('vocab');
  const [searchTerm, setSearchTerm] = useState('');
  const [learnedWords, setLearnedWords] = useState(() => {
    try { return JSON.parse(localStorage.getItem('jr_vocab_learned') || '[]'); } catch { return []; }
  });
  const [flashMode, setFlashMode] = useState(false);
  const [flashIdx, setFlashIdx] = useState(0);
  const [showAnswer, setShowAnswer] = useState(false);
  const [filterMode, setFilterMode] = useState('all'); // all | learned | unlearned

  const saveLearnedWords = (next) => {
    setLearnedWords(next);
    localStorage.setItem('jr_vocab_learned', JSON.stringify(next));
    setVocabCount(next.length);
    sv({ vocabCount: next.length });
  };

  const toggleWord = (num) => {
    const next = learnedWords.includes(num)
      ? learnedWords.filter(n => n !== num)
      : [...learnedWords, num];
    saveLearnedWords(next);
  };

  const filteredWords = VOCAB_LIST.filter(([num, sp, en]) => {
    const matchSearch = !searchTerm ||
      sp.toLowerCase().includes(searchTerm.toLowerCase()) ||
      en.toLowerCase().includes(searchTerm.toLowerCase());
    const isLearned = learnedWords.includes(num);
    const matchFilter = filterMode === 'all' || (filterMode === 'learned' && isLearned) || (filterMode === 'unlearned' && !isLearned);
    return matchSearch && matchFilter;
  });

  const unlearnedWords = VOCAB_LIST.filter(([num]) => !learnedWords.includes(num));
  const flashWords = filterMode === 'learned'
    ? VOCAB_LIST.filter(([num]) => learnedWords.includes(num))
    : unlearnedWords;

  const nextFlash = () => { setFlashIdx(i => (i+1) % Math.max(1, flashWords.length)); setShowAnswer(false); };
  const prevFlash = () => { setFlashIdx(i => (i-1+flashWords.length) % Math.max(1, flashWords.length)); setShowAnswer(false); };

  const currentFlash = flashWords[flashIdx % Math.max(1, flashWords.length)];

  // Group by category ranges
  const categories = [
    { label:'Core Words 1–100', range:[1,100] },
    { label:'Core Words 101–200', range:[101,200] },
    { label:'Numbers + Time', range:[201,257] },
    { label:'Family + People', range:[258,295] },
    { label:'Body', range:[296,335] },
    { label:'Home + Objects', range:[336,415] },
    { label:'Clothes + Colors', range:[416,490] },
    { label:'Nature + Animals', range:[491,530] },
    { label:'Time Expressions', range:[531,568] },
    { label:'Places + Transport', range:[569,608] },
    { label:'Work + Professions', range:[609,647] },
    { label:'Emotions + Character', range:[648,687] },
    { label:'Technology', range:[688,726] },
    { label:'Actions + Daily Life', range:[727,801] },
    { label:'Abstract + Connectors', range:[802,841] },
    { label:'Sports + Leisure', range:[842,880] },
    { label:'Health + Medical', range:[881,920] },
    { label:'Money + Shopping', range:[921,948] },
    { label:'Abstract Concepts', range:[949,998] },
  ];

  return (
    <div>
      <div style={{ fontSize:18, fontWeight:700, marginBottom:4 }}>🇪🇸 Spanish</div>
      <div style={{ fontSize:11, color:T.textFaint, marginBottom:14 }}>
        998 words · Goal: learned by Jan 30, 2027 · Disaster response fluency
      </div>

      {/* Progress summary */}
      <div style={{ background:T.surface, border:`1px solid ${T.border}`,
        borderRadius:10, padding:'12px 14px', marginBottom:14 }}>
        <div style={{ display:'flex', justifyContent:'space-between', marginBottom:8 }}>
          <span style={{ fontSize:13, fontWeight:700, color:TEAL }}>{learnedWords.length} / 998 words learned</span>
          <span style={{ fontSize:11, color:T.textFaint }}>{Math.round(learnedWords.length/9.98)}%</span>
        </div>
        <ProgressBar value={learnedWords.length} max={998} color={TEAL} />
        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:8, marginTop:12 }}>
          <div style={{ background:T.card, borderRadius:8, padding:'8px 10px' }}>
            <div style={{ fontSize:10, color:T.textFaint }}>Pimsleur</div>
            <div style={{ fontSize:18, fontWeight:700, color:AMBER }}>{pimsleurCount}</div>
            <div style={{ fontSize:9, color:T.textFaint }}>lessons / 192</div>
          </div>
          <div style={{ background:T.card, borderRadius:8, padding:'8px 10px' }}>
            <div style={{ fontSize:10, color:T.textFaint }}>LingoPie</div>
            <div style={{ fontSize:18, fontWeight:700, color:BLUE }}>{lingopieCount}</div>
            <div style={{ fontSize:9, color:T.textFaint }}>videos / 192</div>
          </div>
        </div>
        <div style={{ display:'flex', gap:8, marginTop:10 }}>
          {[['Pimsleur',pimsleurCount,setPimsleurCount,AMBER,'pimsleurCount'],
            ['LingoPie',lingopieCount,setLingopieCount,BLUE,'lingopieCount']].map(([label,val,setter,col,key]) => (
            <div key={label} style={{ flex:1, display:'flex', gap:6 }}>
              <button onClick={() => { const n=Math.max(0,val-1); setter(n); sv({[key]:n}); }}
                style={{ flex:1, background:T.card, border:`1px solid ${T.border}`, borderRadius:6,
                  padding:'6px', color:T.text, cursor:'pointer', fontSize:14 }}>−</button>
              <button onClick={() => { const n=val+1; setter(n); sv({[key]:n}); }}
                style={{ flex:2, background:col, border:'none', borderRadius:6,
                  padding:'6px', color:'#111', cursor:'pointer', fontSize:12, fontWeight:700 }}>+1 {label}</button>
            </div>
          ))}
        </div>
      </div>

      {/* Tabs */}
      <div style={{ display:'flex', gap:6, marginBottom:14 }}>
        {[['vocab','📚 Words'],['flash','🎴 Flash'],['lessons','🎥 Lessons']].map(([t,label]) => (
          <button key={t} onClick={() => setTab(t)} style={{
            flex:1, padding:'8px 4px', borderRadius:8, border:'none',
            background: tab===t ? TEAL : T.surface,
            color: tab===t ? '#111' : T.textFaint,
            fontFamily:'Georgia,serif', fontSize:11, cursor:'pointer', fontWeight:700,
          }}>{label}</button>
        ))}
      </div>

      {/* VOCAB TAB */}
      {tab === 'vocab' && (
        <div>
          {/* Search + filter */}
          <input
            type="text" placeholder="Search Spanish or English..."
            value={searchTerm} onChange={e => setSearchTerm(e.target.value)}
            style={{ width:'100%', background:T.surface, border:`1px solid ${T.border}`,
              borderRadius:8, padding:'10px 12px', color:T.text, fontFamily:'Georgia,serif',
              fontSize:13, boxSizing:'border-box', marginBottom:8 }} />
          <div style={{ display:'flex', gap:6, marginBottom:12 }}>
            {[['all','All'],['unlearned','To Learn'],['learned','Learned']].map(([f,label]) => (
              <button key={f} onClick={() => setFilterMode(f)} style={{
                flex:1, padding:'6px', borderRadius:6, border:'none',
                background: filterMode===f ? TEAL : T.surface,
                color: filterMode===f ? '#111' : T.textFaint,
                fontFamily:'Georgia,serif', fontSize:11, cursor:'pointer',
              }}>{label}</button>
            ))}
          </div>

          <div style={{ fontSize:11, color:T.textFaint, marginBottom:8 }}>
            Showing {filteredWords.length} words — tap to mark learned
          </div>

          {/* Category groups (when no search) */}
          {!searchTerm && filterMode === 'all' ? (
            categories.map(cat => {
              const catWords = VOCAB_LIST.filter(([n]) => n >= cat.range[0] && n <= cat.range[1]);
              const catLearned = catWords.filter(([n]) => learnedWords.includes(n)).length;
              return (
                <details key={cat.label} style={{ marginBottom:8 }}>
                  <summary style={{
                    background:T.surface, border:`1px solid ${T.border}`,
                    borderRadius:8, padding:'10px 12px', cursor:'pointer', listStyle:'none',
                    display:'flex', justifyContent:'space-between', alignItems:'center',
                  }}>
                    <span style={{ fontSize:12, fontWeight:700, color:T.text }}>{cat.label}</span>
                    <span style={{ fontSize:11, color: catLearned===catWords.length ? TEAL : T.textFaint }}>
                      {catLearned}/{catWords.length}
                    </span>
                  </summary>
                  <div style={{ background:T.card, border:`1px solid ${T.border}`,
                    borderTop:'none', borderRadius:'0 0 8px 8px', padding:'8px 4px' }}>
                    {catWords.map(([num, sp, en]) => {
                      const learned = learnedWords.includes(num);
                      return (
                        <div key={num} onClick={() => toggleWord(num)} style={{
                          display:'flex', alignItems:'center', gap:10, padding:'7px 10px',
                          borderBottom:`1px solid ${T.border}`, cursor:'pointer',
                          background: learned ? TEAL+'11' : 'transparent',
                        }}>
                          <div style={{ width:20, height:20, borderRadius:10, flexShrink:0,
                            background: learned ? TEAL : 'transparent',
                            border:`2px solid ${learned ? TEAL : T.border}`,
                            display:'flex', alignItems:'center', justifyContent:'center' }}>
                            {learned && <span style={{ fontSize:9, color:'#111', fontWeight:900 }}>✓</span>}
                          </div>
                          <span style={{ width:22, fontSize:9, color:T.textFaint, flexShrink:0 }}>{num}</span>
                          <span style={{ flex:1, fontSize:13, fontWeight:700,
                            color: learned ? T.textFaint : T.text }}>{sp}</span>
                          <span style={{ fontSize:11, color:T.textFaint, textAlign:'right', maxWidth:120 }}>{en}</span>
                        </div>
                      );
                    })}
                  </div>
                </details>
              );
            })
          ) : (
            /* Flat list for search/filter */
            filteredWords.slice(0, 200).map(([num, sp, en]) => {
              const learned = learnedWords.includes(num);
              return (
                <div key={num} onClick={() => toggleWord(num)} style={{
                  display:'flex', alignItems:'center', gap:10, padding:'8px 10px',
                  background: learned ? TEAL+'11' : T.surface,
                  border:`1px solid ${learned ? TEAL+'44' : T.border}`,
                  borderRadius:8, marginBottom:4, cursor:'pointer',
                }}>
                  <div style={{ width:20, height:20, borderRadius:10, flexShrink:0,
                    background: learned ? TEAL : 'transparent',
                    border:`2px solid ${learned ? TEAL : T.border}`,
                    display:'flex', alignItems:'center', justifyContent:'center' }}>
                    {learned && <span style={{ fontSize:9, color:'#111', fontWeight:900 }}>✓</span>}
                  </div>
                  <span style={{ width:22, fontSize:9, color:T.textFaint, flexShrink:0 }}>{num}</span>
                  <span style={{ flex:1, fontSize:13, fontWeight:700,
                    color: learned ? T.textFaint : T.text }}>{sp}</span>
                  <span style={{ fontSize:11, color:T.textFaint }}>{en}</span>
                </div>
              );
            })

          {!searchTerm && filterMode !== 'all' && filteredWords.length > 200 && (
            <div style={{ textAlign:'center', color:T.textFaint, fontSize:11, padding:12 }}>
              Showing first 200 of {filteredWords.length} — use search to narrow
            </div>
          )}
        </div>
      )}

      {tab === 'flash' && (
        <div>
          <div style={{ display:'flex', gap:6, marginBottom:14 }}>
            {[['unlearned','Study New'],['learned','Review Learned']].map(([f,label]) => (
              <button key={f} onClick={() => { setFilterMode(f); setFlashIdx(0); setShowAnswer(false); }} style={{
                flex:1, padding:'8px', borderRadius:8, border:'none',
                background: filterMode===f ? AMBER : T.surface,
                color: filterMode===f ? '#111' : T.textFaint,
                fontFamily:'Georgia,serif', fontSize:11, cursor:'pointer', fontWeight:700,
              }}>{label}</button>
            ))}
          </div>

          {flashWords.length === 0 ? (
            <div style={{ textAlign:'center', padding:40, color:T.textFaint }}>
              {filterMode === 'learned' ? 'No words learned yet — mark some in the Words tab.' : '🎉 All words learned!'}
            </div>
          ) : (
            <div>
              <div style={{ fontSize:11, color:T.textFaint, textAlign:'center', marginBottom:12 }}>
                Card {(flashIdx % flashWords.length) + 1} of {flashWords.length}
              </div>
              {/* Flashcard */}
              <div onClick={() => setShowAnswer(!showAnswer)} style={{
                background:T.surface, border:`2px solid ${TEAL}`,
                borderRadius:16, padding:'40px 20px', textAlign:'center',
                marginBottom:16, cursor:'pointer', minHeight:160,
                display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center',
              }}>
                {currentFlash && (
                  <>
                    <div style={{ fontSize:11, color:T.textFaint, marginBottom:8 }}>
                      #{currentFlash[0]}
                    </div>
                    <div style={{ fontSize:28, fontWeight:700, color:TEAL, marginBottom:showAnswer ? 16 : 0 }}>
                      {currentFlash[1]}
                    </div>
                    {showAnswer ? (
                      <div style={{ fontSize:18, color:T.text, borderTop:`1px solid ${T.border}`,
                        paddingTop:16, width:'100%' }}>{currentFlash[2]}</div>
                    ) : (
                      <div style={{ fontSize:11, color:T.textFaint, marginTop:12 }}>tap to reveal</div>
                    )}
                  </>
                )}
              </div>

              {/* Controls */}
              <div style={{ display:'flex', gap:8, marginBottom:12 }}>
                <button onClick={prevFlash} style={{ flex:1, background:T.surface,
                  border:`1px solid ${T.border}`, borderRadius:8, padding:'10px',
                  color:T.text, cursor:'pointer', fontSize:16 }}>←</button>
                {currentFlash && (
                  <button onClick={() => { toggleWord(currentFlash[0]); nextFlash(); }} style={{
                    flex:2, background: learnedWords.includes(currentFlash[0]) ? T.surface : TEAL,
                    border:`1px solid ${learnedWords.includes(currentFlash[0]) ? T.border : TEAL}`,
                    borderRadius:8, padding:'10px', color: learnedWords.includes(currentFlash[0]) ? T.textFaint : '#111',
                    cursor:'pointer', fontSize:12, fontWeight:700, fontFamily:'Georgia,serif',
                  }}>
                    {learnedWords.includes(currentFlash[0]) ? '✓ Unmark' : '✓ Mark Learned'}
                  </button>
                )}
                <button onClick={nextFlash} style={{ flex:1, background:T.surface,
                  border:`1px solid ${T.border}`, borderRadius:8, padding:'10px',
                  color:T.text, cursor:'pointer', fontSize:16 }}>→</button>
              </div>
            </div>
          )}

  disasterDone, setDisasterDone, sv, Pill, ProgressBar }) {

  const [openMonth, setOpenMonth] = useState(null);

  const toggleCourse = (id) => {

function CycleView({ T, TEAL, AMBER, BLUE, PURPLE, RED,
  cycleStart, setCycleStart, bleedDays, setBleedDays,
  feelingsLog, setFeelingsLog, cyclePhase, cycleDay, phaseColor, phaseLabel, sv, Pill }) {

  const [selDate, setSelDate] = useState(new Date().toISOString().slice(0,10));
  const [feeling, setFeeling] = useState('');

  const logFeeling = () => {
    if (!feeling.trim()) return;
    const next = { ...feelingsLog, [selDate]: feeling };
    setFeelingsLog(next); sv({ feelingsLog: next });
    setFeeling('');
  };

  const toggleBleed = (date) => {
    const next = bleedDays.includes(date)
      ? bleedDays.filter(d => d !== date)
      : [...bleedDays, date];
    setBleedDays(next); sv({ bleedDays: next });
  };

  const phaseInfo = {
    menstrual: { icon:'🩸', color:RED, energy:'Low Energy Week', training:'10% effort. Yoga, walks, gentle swim. No weights.', frenzel:'Best Frenzel gains. Parasympathetic access highest.', nutrition:'Iron-rich foods. Vitamin C. Magnesium. Hydrate more.' },
    follicular: { icon:'🌱', color:TEAL, energy:'Energy Rising', training:'Build intensity. Increase weights and distances progressively.', frenzel:'Good Frenzel window. Practice all positions.', nutrition:'Fresh greens, eggs, seeds, lean protein.' },
    ovulatory: { icon:'🔥', color:AMBER, energy:'Peak Power', training:'Go hard. Heaviest loads. Static PRs. Race simulation. Best week for breakthrough sessions.', frenzel:'Peak coordination. Best dynamic apnea performance.', nutrition:'Maintain protein. Light on carbs. Peak performance window.' },
    luteal: { icon:'🍂', color:PURPLE, energy:'High Energy — Building', training:'Maintain loads. Prioritise sleep. Shift to endurance.', frenzel:'Consistent Frenzel practice. All positions.', nutrition:'Complex carbs. Magnesium. Dark chocolate. Reduce sugar.' },
  };
  const info = phaseInfo[cyclePhase] || phaseInfo.follicular;

  // Simple calendar for current month
  const today = new Date();
  const yr = today.getFullYear(), mo = today.getMonth();
  const firstDay = new Date(yr, mo, 1).getDay();
  const daysInMonth = new Date(yr, mo+1, 0).getDate();
  const calDays = Array.from({ length: firstDay }, () => null)
    .concat(Array.from({ length: daysInMonth }, (_,i) => i+1));

  return (
    <div>
      <div style={{ fontSize:18, fontWeight:700, marginBottom:4 }}>🌙 Cycle</div>
      <div style={{ fontSize:11, color:T.textFaint, marginBottom:14 }}>
        3 weeks high energy · 1 week low energy · 31-day cycle
      </div>

      {/* Current phase */}
      <div style={{ background: info.color + '18', border:`1px solid ${info.color}44`,
        borderRadius:12, padding:'14px 16px', marginBottom:14 }}>
        <div style={{ fontSize:22, marginBottom:4 }}>{info.icon}</div>
        <div style={{ fontSize:16, fontWeight:700, color:info.color, marginBottom:2 }}>{phaseLabel}</div>
        <div style={{ fontSize:11, color:T.textFaint }}>Day {cycleDay} of 31</div>
        <div style={{ height:1, background:info.color+'33', margin:'10px 0' }} />
        <div style={{ fontSize:11, color:T.textSub, marginBottom:4 }}>⚡ {info.energy}</div>
        <div style={{ fontSize:11, color:T.textSub, marginBottom:4 }}>🏋️ {info.training}</div>
        <div style={{ fontSize:11, color:T.textSub, marginBottom:4 }}>🤿 {info.frenzel}</div>
        <div style={{ fontSize:11, color:T.textSub }}>🥗 {info.nutrition}</div>
      </div>

      {/* Cycle start */}
      <div style={{ background:T.surface, border:`1px solid ${T.border}`,
        borderRadius:10, padding:'12px 14px', marginBottom:14 }}>
        <div style={{ fontSize:12, fontWeight:700, color:T.text, marginBottom:8 }}>Cycle Start Date</div>
        <input type="date" value={cycleStart}
          onChange={e => {
            setCycleStart(e.target.value);
            sv({ cycleStart: e.target.value });
          }}
          style={{ width:'100%', background:T.card, border:`1px solid ${T.border}`,
            borderRadius:6, padding:'8px 12px', color:T.text, fontFamily:'Georgia,serif',
            fontSize:13, boxSizing:'border-box' }} />
      </div>

      {/* Calendar */}
      <div style={{ background:T.surface, border:`1px solid ${T.border}`,
        borderRadius:10, padding:'12px 14px', marginBottom:14 }}>
        <div style={{ fontSize:12, fontWeight:700, color:T.text, marginBottom:10 }}>
          {today.toLocaleString('default', { month:'long' })} — tap to mark flow
        </div>
        <div style={{ display:'grid', gridTemplateColumns:'repeat(7,1fr)', gap:4 }}>
          {['S','M','T','W','T','F','S'].map(d => (
            <div key={d} style={{ textAlign:'center', fontSize:10, color:T.textFaint, paddingBottom:4 }}>{d}</div>
          ))}
          {calDays.map((day, i) => {
            if (!day) return <div key={i} />;
            const dateStr = `${yr}-${String(mo+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
            const isBleed = bleedDays.includes(dateStr);
            const isToday = day === today.getDate();
            return (
              <div key={i} onClick={() => toggleBleed(dateStr)} style={{
                textAlign:'center', padding:'6px 2px', borderRadius:6, cursor:'pointer',
                background: isBleed ? RED : isToday ? TEAL+'33' : 'transparent',

                fontSize:11, fontWeight: isToday ? 700 : 400,

      </div>

      {/* Feelings log */}
      <div style={{ background:T.surface, border:`1px solid ${T.border}`,
        borderRadius:10, padding:'12px 14px' }}>
        <div style={{ fontSize:12, fontWeight:700, color:T.text, marginBottom:8 }}>Daily Note</div>

          style={{ width:'100%', background:T.card, border:`1px solid ${T.border}`,
            borderRadius:6, padding:'6px 10px', color:T.text, fontFamily:'Georgia,serif',
            fontSize:12, boxSizing:'border-box', marginBottom:8 }} />
        <textarea value={feeling} onChange={e => setFeeling(e.target.value)}
          placeholder="How are you feeling today?"
          style={{ width:'100%', background:T.card, border:`1px solid ${T.border}`,
            borderRadius:6, padding:'8px 12px', color:T.text, fontFamily:'Georgia,serif',
            fontSize:12, boxSizing:'border-box', minHeight:70, resize:'none', marginBottom:8 }} />
        <button onClick={logFeeling} style={{ background:PURPLE, color:'#fff', border:'none',
          borderRadius:8, padding:'8px 20px', fontFamily:'Georgia,serif', fontSize:12,
          cursor:'pointer', width:'100%' }}>Save Note</button>

            borderTop:`1px solid ${T.border}`, paddingTop:8 }}>

          </div>
          {staticLog.length === 0 && (
            <div style={{ textAlign:'center', color:T.textFaint, padding:32, fontSize:12 }}>
              No holds logged yet. Log from the Swim tab.
            </div>
          )}
          {staticLog.map((e,i) => (
            <div key={i} style={{ background:T.surface, border:`1px solid ${T.border}`,
              borderRadius:8, padding:'10px 14px', marginBottom:8,
              display:'flex', justifyContent:'space-between', alignItems:'center' }}>
              <div>
                <div style={{ fontSize:11, color:T.textFaint }}>{e.date}</div>
                {e.note && <div style={{ fontSize:11, color:T.textSub, marginTop:2 }}>{e.note}</div>}
              </div>
              <div style={{ fontSize:20, fontWeight:700, color:TEAL }}>{e.time}</div>
            </div>
          ))}
        </div>
      )}

      {tab === 'swim' && (
        <div>
          <div style={{ fontSize:12, color:T.textFaint, marginBottom:10 }}>
            Swim distances · Goal: 100m comfortable Jan 30 · 120m Mar 1
          </div>
          {(swimLog||[]).length === 0 && (
            <div style={{ textAlign:'center', color:T.textFaint, padding:32, fontSize:12 }}>
              No swims logged yet.
            </div>
          )}
          {(swimLog||[]).map((e,i) => (
            <div key={i} style={{ background:T.surface, border:`1px solid ${T.border}`,
              borderRadius:8, padding:'10px 14px', marginBottom:8,
              display:'flex', justifyContent:'space-between', alignItems:'center' }}>
              <div>
                <div style={{ fontSize:11, color:T.textFaint }}>{e.date}</div>
                {e.note && <div style={{ fontSize:11, color:T.textSub, marginTop:2 }}>{e.note}</div>}
              </div>
              <div style={{ fontSize:20, fontWeight:700, color:BLUE }}>{e.distance}m</div>
            </div>
          ))}
        </div>
      )}

      {tab === 'notes' && (
        <div>
          <div style={{ fontSize:12, fontWeight:700, color:AMBER, marginBottom:8 }}>Weekly Reflection</div>
          <textarea value={reflection} onChange={e => { setReflection(e.target.value); sv({ reflection: e.target.value }); }}
            placeholder="What worked this week? What needs adjusting?"
            style={{ width:'100%', background:T.surface, border:`1px solid ${T.border}`,
              borderRadius:8, padding:'10px 12px', color:T.text, fontFamily:'Georgia,serif',
              fontSize:12, boxSizing:'border-box', minHeight:120, resize:'none', marginBottom:12 }} />
          <div style={{ fontSize:12, fontWeight:700, color:BLUE, marginBottom:8 }}>Quick Notes</div>
          <textarea value={notes} onChange={e => { setNotes(e.target.value); sv({ notes: e.target.value }); }}
            placeholder="Anything you want to remember..."
            style={{ width:'100%', background:T.surface, border:`1px solid ${T.border}`,
              borderRadius:8, padding:'10px 12px', color:T.text, fontFamily:'Georgia,serif',
              fontSize:12, boxSizing:'border-box', minHeight:100, resize:'none' }} />
        </div>
      )}
    </div>
  );
}



// ── THEME ──
const DARK = {
  bg:'#0b0d10', surface:'#13161c', card:'#1a1d24', border:'#2a2d34',
  text:'#dde4ee', textSub:'#b0b8cc', textFaint:'#888ea8', textVeryDim:'#555566',
};
const LIGHT = {
  bg:'#f4f6fb', surface:'#ffffff', card:'#f0f2f8', border:'#d8dce8',
  text:'#1a1d28', textSub:'#3a4060', textFaint:'#7080a0', textVeryDim:'#aab0c0',
};

const TEAL   = '#4ecdc4';
const BLUE   = '#6699cc';
const AMBER  = '#f0a500';
const PURPLE = '#9b8ec4';
const RED    = '#e05555';
const GREEN  = '#5cb85c';

const STORAGE_KEY = 'jr_v1';

function save(updates, state) {
  const current = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
  localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...current, ...updates }));
}

function load() {
  try {
    const raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    // Always derive cycle phase from start date
    const { cyclePhase: _cp, cycleDay: _cd, ...rest } = raw;
    return rest;
  } catch { return {}; }
}

function Pill({ color, children }) {
  return (
    <span style={{ background: color + '22', color, borderRadius:12, padding:'2px 10px',
      fontSize:10, fontWeight:700, letterSpacing:'0.08em', textTransform:'uppercase' }}>
      {children}
    </span>
  );
}

function Check({ done, color, onToggle, size=16 }) {
  return (
    <div onClick={onToggle} style={{ width:size, height:size, borderRadius:size/2,
      border:`2px solid ${done ? color : '#444'}`, background: done ? color : 'transparent',
      cursor:'pointer', flexShrink:0, display:'flex', alignItems:'center', justifyContent:'center',
      transition:'all 0.15s' }}>
      {done && <span style={{ color:'#111', fontSize:size*0.6, fontWeight:900, lineHeight:1 }}>✓</span>}
    </div>
  );
}

function ProgressBar({ value, max, color }) {
  const pct = max === 0 ? 0 : Math.min(100, Math.round((value/max)*100));
  return (
    <div style={{ height:6, background:'#2a2d34', borderRadius:3, overflow:'hidden' }}>
      <div style={{ height:'100%', width:`${pct}%`, background:color, transition:'width 0.4s', borderRadius:3 }} />
    </div>
  );
}

function App() {
  const [dark, setDark] = useState(true);
  const T = dark ? DARK : LIGHT;

  const [view, setView] = useState('home');
  const [checked, setChecked] = useState({});
  const [mochaLog, setMochaLog] = useState({});
  const [mochaBiting, setMochaBiting] = useState([]);
  const [mochaScores, setMochaScores] = useState({});
  const [cycleStart, setCycleStart] = useState('2026-08-10');
  const [bleedDays, setBleedDays] = useState([]);
  const [feelingsLog, setFeelingsLog] = useState({});
  const [staticLog, setStaticLog] = useState([]);
  const [swimLog, setSwimLog] = useState([]);
  const [hsVideosDone, setHsVideosDone] = useState([]);
  const [hsReelsDone, setHsReelsDone] = useState({});
  const [pimsleurCount, setPimsleurCount] = useState(0);
  const [lingopieCount, setLingopieCount] = useState(0);
  const [vocabCount, setVocabCount] = useState(0);
  const [vocabLog, setVocabLog] = useState([]);
  const [ppuDone, setPpuDone] = useState([]);
  const [disasterDone, setDisasterDone] = useState([]);
  const [reflection, setReflection] = useState('');
  const [notes, setNotes] = useState('');

  useEffect(() => {
    const d = load();
    if (d.checked) setChecked(d.checked);
    if (d.mochaLog) setMochaLog(d.mochaLog);
    if (d.mochaBiting) setMochaBiting(d.mochaBiting);
    if (d.mochaScores) setMochaScores(d.mochaScores);
    if (d.cycleStart) setCycleStart(d.cycleStart);
    if (d.bleedDays) setBleedDays(d.bleedDays);
    if (d.feelingsLog) setFeelingsLog(d.feelingsLog);
    if (d.staticLog) setStaticLog(d.staticLog);
    if (d.swimLog) setSwimLog(d.swimLog);
    if (d.hsVideosDone) setHsVideosDone(d.hsVideosDone);
    if (d.hsReelsDone) setHsReelsDone(d.hsReelsDone);
    if (d.pimsleurCount) setPimsleurCount(d.pimsleurCount);
    if (d.lingopieCount) setLingopieCount(d.lingopieCount);
    if (d.vocabCount) setVocabCount(d.vocabCount);
    if (d.vocabLog) setVocabLog(d.vocabLog);
    if (d.ppuDone) setPpuDone(d.ppuDone);
    if (d.disasterDone) setDisasterDone(d.disasterDone);
    if (d.reflection) setReflection(d.reflection);
    if (d.notes) setNotes(d.notes);
    if (d.dark !== undefined) setDark(d.dark);
  }, []);

  const sv = (updates) => {
    const current = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...current, ...updates }));
  };

  const toggle = (key) => {
    const next = { ...checked, [key]: !checked[key] };
    setChecked(next); sv({ checked: next });
  };

  // Cycle
  const { phase: cyclePhase, day: cycleDay } = cyclePhaseFromStart(cycleStart);
  const isLowEnergy = cyclePhase === 'menstrual';

  const phaseColor = { menstrual:RED, follicular:TEAL, ovulatory:AMBER, luteal:PURPLE }[cyclePhase] || TEAL;
  const phaseLabel = { menstrual:'🩸 Menstrual — Low Energy Week', follicular:'🌱 Follicular — Energy Rising',
                       ovulatory:'🔥 Ovulatory — Peak Power', luteal:'🍂 Luteal — High Energy' }[cyclePhase];

  const containerStyle = {
    minHeight:'100vh', background:T.bg, color:T.text,
    fontFamily:'Georgia, serif', maxWidth:430, margin:'0 auto',
    paddingBottom: 80,
  };

  const navStyle = {
    position:'fixed', bottom:0, left:'50%', transform:'translateX(-50%)',
    width:'100%', maxWidth:430, background:T.surface,
    borderTop:`1px solid ${T.border}`, display:'flex', zIndex:100,
    paddingBottom:'env(safe-area-inset-bottom)',
  };

  const navItems = [
    { id:'home',  icon:'⌂',  label:'Home' },
    { id:'week',  icon:'📅', label:'Week' },
    { id:'swim',  icon:'🌊', label:'Swim' },
    { id:'gym',   icon:'💪', label:'Gym' },
    { id:'span',  icon:'🇪🇸', label:'Spanish' },
    { id:'hs',    icon:'🌸', label:'Honey' },
    { id:'dis',   icon:'🚨', label:'Disaster' },
    { id:'cycle', icon:'🌙', label:'Cycle' },
    { id:'log',   icon:'📋', label:'Log' },
  ];

  const shared = { T, TEAL, BLUE, AMBER, PURPLE, RED, GREEN,
    checked, toggle, cyclePhase, cycleDay, phaseColor, phaseLabel, isLowEnergy,
    cycleStart, setCycleStart, bleedDays, setBleedDays, feelingsLog, setFeelingsLog,
    staticLog, setStaticLog, swimLog, setSwimLog,
    mochaLog, setMochaLog, mochaBiting, setMochaBiting, mochaScores, setMochaScores,
    hsVideosDone, setHsVideosDone, hsReelsDone, setHsReelsDone,
    pimsleurCount, setPimsleurCount, lingopieCount, setLingopieCount,
    vocabCount, setVocabCount, vocabLog, setVocabLog,
    ppuDone, setPpuDone, disasterDone, setDisasterDone,
    reflection, setReflection, notes, setNotes, sv, dark, setDark,
    Pill, Check, ProgressBar,
  };

  return (
    <div style={containerStyle}>
      <div style={{ padding:'16px 16px 0' }}>
        {view === 'home'  && <HomeView {...shared} />}
        {view === 'week'  && <WeekView {...shared} />}
        {view === 'swim'  && <SwimView {...shared} />}
        {view === 'gym'   && <GymView {...shared} />}
        {view === 'span'  && <SpanishView {...shared} />}
        {view === 'hs'    && <HoneysuckleView {...shared} />}
        {view === 'dis'   && <DisasterView {...shared} />}
        {view === 'cycle' && <CycleView {...shared} />}
        {view === 'log'   && <LogView {...shared} />}
      </div>

      <nav style={navStyle}>
        {navItems.map(item => (
          <button key={item.id} onClick={() => setView(item.id)} style={{
            flex:1, border:'none', background:'transparent', padding:'8px 2px 6px',
            color: view===item.id ? TEAL : T.textFaint, cursor:'pointer',
            display:'flex', flexDirection:'column', alignItems:'center', gap:2,
          }}>
            <span style={{ fontSize:16 }}>{item.icon}</span>
            <span style={{ fontSize:9, letterSpacing:'0.05em' }}>{item.label}</span>
          </button>
        ))}
      </nav>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
  
</script>
</body>
</html>
